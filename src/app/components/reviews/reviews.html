<div class="container mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Active Reviews</h2>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 dark:border-indigo-400"></div>
    <span class="ml-3 text-gray-600 dark:text-gray-300">Loading reviews...</span>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-4 mb-6" role="alert">
    <div class="flex">
      <div class="flex-shrink-0">
        <lucide-icon name="alert-circle" class="h-5 w-5 text-red-500 dark:text-red-400"></lucide-icon>
      </div>
      <div class="ml-3">
        <p class="text-sm text-red-700 dark:text-red-300">{{ error }}</p>
        <button (click)="loadReviews()" class="mt-2 text-sm font-medium text-red-600 dark:text-red-400 hover:text-red-500 dark:hover:text-red-300 underline">
          Try Again
        </button>
      </div>
    </div>
  </div>

  <!-- Success State: Table -->
  <div *ngIf="!isLoading && !error && reviews.length > 0" class="overflow-x-auto shadow-md sm:rounded-lg">
    <table class="min-w-full text-left text-sm font-light">
      <thead class="border-b bg-gray-50 dark:bg-gray-800 font-medium border-neutral-200 dark:border-neutral-600 text-gray-500 dark:text-gray-300">
        <tr>
          <th scope="col" class="px-6 py-4">Reviewer</th>
          <th scope="col" class="px-6 py-4">Content</th>
          <th scope="col" class="px-6 py-4">Category</th>
          <th scope="col" class="px-6 py-4">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white dark:bg-gray-900">
        <tr *ngFor="let review of reviews" class="border-b border-neutral-200 dark:border-neutral-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition duration-150 ease-in-out">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <img [src]="review.reviewerImageUrl" alt="{{ review.reviewerName }}" class="h-10 w-10 rounded-full object-cover mr-3 border dark:border-gray-600" 
                   onerror="this.src='https://ui-avatars.com/api/?name=User'">
              <div>
                <div class="font-medium text-gray-900 dark:text-white">{{ review.reviewerName }}</div>
                <div class="text-xs text-gray-500 dark:text-gray-400">{{ review.reviewerTitle }}</div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4">
            <p class="text-gray-700 dark:text-gray-300 line-clamp-3" [title]="review.content">{{ review.content }}</p>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200">
              {{ review.category }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span *ngIf="review.isActive" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200">
              Active
            </span>
            <span *ngIf="!review.isActive" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
              Inactive
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- No Data State -->
  <div *ngIf="!isLoading && !error && reviews.length === 0" class="text-center py-12 text-gray-500 dark:text-gray-400">
    No reviews found.
  </div>
</div>
