<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-500">
          <lucide-icon [img]="Code2" class="w-6 h-6"></lucide-icon>
        </div>
        <!-- Interpolation {{}}-->
        <!-- Displays the 'title' variable defined in App component -->
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-500 to-blue-500">
          {{ title }}
        </h1>
      </div>
      
      <div class="flex items-center gap-4">
        <nav class="hidden md:flex gap-6 mr-4">
          <a routerLink="/dashboard" routerLinkActive="text-cyan-500 dark:text-cyan-400" class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors cursor-pointer">Dashboard</a>
          
          @if (!authService.currentUser()) {
            <a routerLink="/login" routerLinkActive="text-cyan-500 dark:text-cyan-400" class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors cursor-pointer">Login</a>
            <a routerLink="/register" routerLinkActive="text-cyan-500 dark:text-cyan-400" class="text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 transition-colors cursor-pointer">Register</a>
          }

          @if (authService.currentUser()) {
            <div class="flex items-center gap-2">
              <span class="text-sm text-slate-500 dark:text-slate-400">
                Hi, {{ authService.currentUser()?.name }}
              </span>
              <button (click)="logout()" class="p-1 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-red-500 transition-colors" title="Logout">
                <lucide-icon [img]="LogOut" class="w-4 h-4"></lucide-icon>
              </button>
            </div>
          }
        </nav>
        
        <button 
          (click)="themeToggled.emit()"
          class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <lucide-icon [img]="isDarkMode ? Sun : Moon" class="w-5 h-5"></lucide-icon>
        </button>
      </div>
    </div>
  </div>
</header>
