<div class="group relative h-full bg-white/50 dark:bg-slate-800/70 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-2xl p-6 hover:scale-105 hover:shadow-[0_0_20px_rgba(6,182,212,0.3)] dark:hover:shadow-[0_0_20px_rgba(6,182,212,0.15)] transition-all duration-300 cursor-pointer overflow-hidden flex flex-col" (click)="onSelect()">
  
  <!-- Glow effect background -->
  <div class="absolute -inset-px bg-gradient-to-r from-cyan-500 to-blue-500 opacity-0 group-hover:opacity-10 dark:group-hover:opacity-20 transition-opacity duration-300 rounded-2xl pointer-events-none"></div>

  <div class="relative z-10 flex-1 flex flex-col">
    <div class="w-12 h-12 rounded-xl bg-cyan-500/10 dark:bg-cyan-500/20 flex items-center justify-center text-cyan-600 dark:text-cyan-400 mb-4 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300">
      <lucide-icon [img]="getIcon(feature.iconName)" class="w-6 h-6"></lucide-icon>
    </div>

    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2 group-hover:text-cyan-600 dark:group-hover:text-cyan-400 transition-colors">
      {{ feature.name }}
    </h3>
    
    <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-4 flex-1">
      {{ feature.description }}
    </p>

    <div class="flex items-center text-sm font-medium text-cyan-600 dark:text-cyan-400 opacity-0 transform translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
      <span>Learn more</span>
      <lucide-icon [img]="ArrowRight" class="w-4 h-4 ml-1"></lucide-icon>
    </div>
  </div>
</div>
